# Builds and publishes a release, either when a version tag (v0.1.0, v1.2.3...) is pushed or when someone runs the
# workflow by hand from the Actions tab (Run workflow, on the main branch: it creates the tag v<mod_version> itself).
# It checks that the tag matches `mod_version`, takes the notes from that version's section of CHANGELOG.md, runs the same
# checks as the CI and attaches the jar to a GitHub release (marked as pre-release while the version starts with 0.). A second job then
# uploads the same jar to CurseForge and Modrinth (a platform is skipped while its token or project id is not set).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # By hand, only from main: a release is never built from a feature branch.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag and check it against the mod version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MOD_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$MOD_VERSION"
          fi
          VERSION="${TAG#v}"
          if [ "$VERSION" != "$MOD_VERSION" ]; then
            echo "::error::The tag is $TAG but gradle.properties says mod_version=$MOD_VERSION"
            exit 1
          fi
          # A run by hand must not overwrite a version that is already published.
          if [ "$GITHUB_REF_TYPE" != "tag" ] && gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG is already released: raise mod_version (and the changelog) first"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section '## [$VERSION]' with content"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and unit tests
        run: ./gradlew build --console=plain

      - name: Game tests
        run: ./gradlew runGameTestServer --console=plain

      # The game tests run in the dev environment; this starts the built jar on a real NeoForge dedicated server.
      - name: Dedicated server
        run: tools/ci/dedicated-server-smoke.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          case "$VERSION" in 0.*) FLAGS="--prerelease" ;; esac
          gh release create "$TAG" "build/libs/mitofus-${VERSION}.jar" \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md $FLAGS

      # What the next job uploads to CurseForge and Modrinth: the jar and the notes the release just used.
      - name: Keep the jar and the notes for the platforms job
        run: |
          mkdir -p platform-upload
          cp "build/libs/mitofus-${VERSION}.jar" release-notes.md platform-upload/
          echo "$VERSION" > platform-upload/version.txt
          echo "$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" > platform-upload/minecraft.txt

      - uses: actions/upload-artifact@v4
        with:
          name: platform-upload
          path: platform-upload
          retention-days: 14

  # Uploads the same jar to CurseForge and Modrinth. A platform is skipped (not an error) while its token or project id is
  # not set, so this job is safe to merge before the accounts are ready. It is a separate job so that, if one upload fails,
  # "Re-run failed jobs" repeats only this step and does not try to create the GitHub release again.
  platforms:
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: platform-upload
          path: platform-upload

      - name: Read the version
        run: |
          VERSION="$(cat platform-upload/version.txt)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MINECRAFT=$(cat platform-upload/minecraft.txt)" >> "$GITHUB_ENV"
          # 0.x versions are alphas on the platforms (and a pre-release on GitHub): they are early previews.
          case "$VERSION" in 0.*) echo "VERSION_TYPE=alpha" >> "$GITHUB_ENV" ;; *) echo "VERSION_TYPE=release" >> "$GITHUB_ENV" ;; esac

      - name: Check which platforms are configured
        id: cfg
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MR_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CF_ID: ${{ vars.CURSEFORGE_ID }}
          MR_ID: ${{ vars.MODRINTH_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ID" ]; then echo "curseforge=true" >> "$GITHUB_OUTPUT"; else echo "::notice::CurseForge skipped: CURSEFORGE_TOKEN or CURSEFORGE_ID is not set"; fi
          if [ -n "$MR_TOKEN" ] && [ -n "$MR_ID" ]; then echo "modrinth=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Modrinth skipped: MODRINTH_TOKEN or MODRINTH_ID is not set"; fi

      - name: Publish to CurseForge and Modrinth
        if: steps.cfg.outputs.curseforge == 'true' || steps.cfg.outputs.modrinth == 'true'
        uses: Kir-Antipov/mc-publish@v3.3.2
        with:
          # Set these in the repository: Settings > Secrets and variables > Actions.
          curseforge-id: ${{ steps.cfg.outputs.curseforge == 'true' && vars.CURSEFORGE_ID || '' }}
          curseforge-token: ${{ steps.cfg.outputs.curseforge == 'true' && secrets.CURSEFORGE_TOKEN || '' }}
          modrinth-id: ${{ steps.cfg.outputs.modrinth == 'true' && vars.MODRINTH_ID || '' }}
          modrinth-token: ${{ steps.cfg.outputs.modrinth == 'true' && secrets.MODRINTH_TOKEN || '' }}
          files: platform-upload/mitofus-${{ env.VERSION }}.jar
          name: Mitofus ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          version-type: ${{ env.VERSION_TYPE }}
          changelog-file: platform-upload/release-notes.md
          loaders: neoforge
          game-versions: ${{ env.MINECRAFT }}
          java: 21
